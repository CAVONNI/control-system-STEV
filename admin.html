<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icono-touch-de-apple.png" />
    <meta name="apple-mobile-web-app-title" content="SCI-STEV" />
    <link rel="manifest" href="./sitio.manifiesto web" />
    <title>Panel Admin · Reclamos CLH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #0b0f1a;
        --bg-card: #1a2235;
        --bg-card2: #141c2e;
        --bg-input: rgba(11, 15, 26, 0.75);
        --accent: #00d4ff;
        --accent-glow: rgba(0, 212, 255, 0.15);
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --accent-amber: #f59e0b;
        --border: rgba(0, 212, 255, 0.12);
        --border-strong: rgba(0, 212, 255, 0.35);
        --text-primary: #e8edf5;
        --text-secondary: #8fa3c0;
        --text-muted: #4d6080;
        --font-display: "Rajdhani", sans-serif;
        --font-mono: "DM Mono", monospace;
        --radius: 14px;
        --radius-sm: 8px;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-display);
        background-color: var(--bg-deep);
        background-image: radial-gradient(
            ellipse 70% 50% at 50% -5%,
            rgba(0, 212, 255, 0.1),
            transparent 65%
          ),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 39px,
            rgba(0, 212, 255, 0.022) 39px,
            rgba(0, 212, 255, 0.022) 40px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 39px,
            rgba(0, 212, 255, 0.022) 39px,
            rgba(0, 212, 255, 0.022) 40px
          );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 24px 80px;
        color: var(--text-primary);
      }

      /* ── LOCK SCREEN ── */
      #lockScreen {
        width: 100%;
        max-width: 400px;
        text-align: center;
        animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #lockScreen .lock-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      #lockScreen h2 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      #lockScreen p {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 28px;
      }
      .lock-input {
        width: 100%;
        background: var(--bg-card);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 18px;
        padding: 14px 18px;
        outline: none;
        text-align: center;
        letter-spacing: 4px;
        margin-bottom: 14px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .lock-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.12);
      }
      .btn-unlock {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #0a3d62, #1e5f8e);
        color: var(--accent);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-unlock:hover {
        background: linear-gradient(135deg, #0d4e7a, #2470a8);
        transform: translateY(-1px);
      }
      .lock-error {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--accent-red);
        margin-top: 10px;
        letter-spacing: 1px;
        min-height: 18px;
      }

      /* ── PANEL ── */
      #adminPanel {
        display: none;
        width: 100%;
        max-width: 620px;
      }

      .page-header {
        text-align: center;
        margin-bottom: 36px;
        animation: slideDown 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .page-header h1 {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .page-header h1 span {
        color: var(--accent);
      }
      .page-header p {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--text-muted);
        margin-top: 6px;
        text-transform: uppercase;
      }
      .accent-line {
        width: 50px;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        margin: 10px auto 0;
        border-radius: 2px;
      }

      /* Tabs */
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 5px;
      }
      .tab-btn {
        flex: 1;
        padding: 9px 14px;
        background: none;
        border: none;
        border-radius: 6px;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab-btn.active {
        background: rgba(0, 212, 255, 0.12);
        color: var(--accent);
        border: 1px solid var(--border-strong);
      }

      /* Card */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 30px 30px 26px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55),
          0 0 30px rgba(0, 212, 255, 0.05);
        position: relative;
        margin-bottom: 20px;
        animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        width: 80%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        border-radius: 2px;
      }
      .card-title {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 22px;
      }

      .field {
        margin-bottom: 14px;
      }
      label.fl {
        display: block;
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 5px;
      }
      input[type="text"],
      input[type="password"],
      select {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 13px;
        padding: 10px 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      input::placeholder {
        color: var(--text-muted);
        font-size: 11px;
      }
      input:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      }
      select {
        color: var(--text-secondary);
      }
      select option {
        background: var(--bg-card);
      }

      .row-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .btn-primary {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        background: linear-gradient(135deg, #0a3d62, #1e5f8e);
        color: var(--accent);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 0 16px rgba(0, 212, 255, 0.08);
        transition: all 0.2s ease;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #0d4e7a, #2470a8);
        transform: translateY(-1px);
        box-shadow: 0 0 28px rgba(0, 212, 255, 0.2);
      }

      /* Users list */
      .user-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .user-row {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-card2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 13px 16px;
        transition: all 0.2s;
      }
      .user-row:hover {
        border-color: var(--border-strong);
        background: rgba(0, 212, 255, 0.03);
      }
      .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          rgba(0, 212, 255, 0.15),
          rgba(0, 212, 255, 0.05)
        );
        border: 1px solid var(--border-strong);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
        flex-shrink: 0;
        text-transform: uppercase;
      }
      .user-info {
        flex: 1;
        min-width: 0;
      }
      .user-name {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--text-primary);
      }
      .user-meta {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 1px;
        margin-top: 2px;
      }
      .user-badge {
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 3px 9px;
        border-radius: 999px;
      }
      .badge-admin {
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.35);
        color: #f59e0b;
      }
      .badge-operario {
        background: rgba(0, 212, 255, 0.08);
        border: 1px solid var(--border);
        color: var(--text-muted);
      }
      .badge-inactivo {
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.25);
        color: var(--accent-red);
      }

      .user-actions {
        display: flex;
        gap: 6px;
      }
      .btn-icon {
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        width: 32px;
        height: 32px;
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        color: var(--text-muted);
      }
      .btn-icon:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-glow);
      }
      .btn-icon.danger:hover {
        border-color: var(--accent-red);
        color: var(--accent-red);
        background: rgba(239, 68, 68, 0.08);
      }

      /* Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(6px);
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal {
        background: var(--bg-card);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        padding: 32px 30px 28px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7),
          0 0 40px rgba(0, 212, 255, 0.08);
        position: relative;
        animation: slideUp 0.3s ease both;
      }
      .modal::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        width: 80%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        border-radius: 2px;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .modal-close {
        position: absolute;
        top: 14px;
        right: 16px;
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 18px;
        cursor: pointer;
        width: auto;
        margin: 0;
        padding: 4px;
        transition: color 0.2s;
      }
      .modal-close:hover {
        color: var(--accent);
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 28px;
        right: 28px;
        padding: 12px 20px;
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(12px);
        transition: all 0.3s ease;
        pointer-events: none;
        z-index: 9999;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .toast.success {
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: var(--accent-green);
      }
      .toast.error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: var(--accent-red);
      }

      .nav-link {
        display: inline-block;
        margin-top: 20px;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
        text-decoration: none;
        padding: 8px 18px;
        border: 1px solid var(--border);
        border-radius: 999px;
        transition: all 0.2s;
      }
      .nav-link:hover {
        color: var(--accent);
        border-color: var(--border-strong);
        background: var(--accent-glow);
      }

      .empty-state {
        text-align: center;
        padding: 32px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        .row-2 {
          grid-template-columns: 1fr;
        }
        .card {
          padding: 22px 18px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ── LOCK SCREEN ── -->
    <div id="lockScreen">
      <div class="lock-icon">🔐</div>
      <h2>Administración</h2>
      <p>Ingresa la clave de administrador para continuar</p>
      <input
        type="password"
        class="lock-input"
        id="adminKeyInput"
        placeholder="••••••••"
      />
      <button class="btn-unlock" onclick="verificarAdmin()">Desbloquear</button>
      <p class="lock-error" id="lockError"></p>
    </div>

    <!-- ── ADMIN PANEL ── -->
    <div id="adminPanel">
      <header class="page-header">
        <h1>Panel de <span>Admin</span></h1>
        <p>Gestión de usuarios del sistema</p>
        <div class="accent-line"></div>
      </header>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tab1" onclick="switchTab('crear')">
          ➕ Crear usuario
        </button>
        <button class="tab-btn" id="tab2" onclick="switchTab('usuarios')">
          👥 Usuarios
        </button>
        <button class="tab-btn" id="tab3" onclick="switchTab('clave')">
          🔑 Mi clave admin
        </button>
      </div>

      <!-- Tab: Crear usuario -->
      <div id="tabCrear">
        <div class="card">
          <p class="card-title">Nuevo usuario operario</p>
          <div class="row-2">
            <div class="field">
              <label class="fl">Username (ID)</label>
              <input type="text" id="newUsername" placeholder="ej: juan123" />
            </div>
            <div class="field">
              <label class="fl">Nombre visible</label>
              <input type="text" id="newNombre" placeholder="ej: Juan Pérez" />
            </div>
          </div>
          <div class="row-2">
            <div class="field">
              <label class="fl">Contraseña</label>
              <input
                type="password"
                id="newClave"
                placeholder="Mínimo 4 caracteres"
              />
            </div>
            <div class="field">
              <label class="fl">Rol</label>
              <select id="newRol">
                <option value="operario">Operario</option>
                <option value="supervisor">Supervisor</option>
              </select>
            </div>
          </div>
          <button class="btn-primary" onclick="crearUsuario()">
            Crear usuario
          </button>
        </div>
      </div>

      <!-- Tab: Lista de usuarios -->
      <div id="tabUsuarios" style="display: none">
        <div class="card">
          <p class="card-title">Usuarios registrados</p>
          <div id="userListContainer">
            <div class="empty-state">Cargando usuarios...</div>
          </div>
        </div>
      </div>

      <!-- Tab: Cambiar clave admin -->
      <div id="tabClave" style="display: none">
        <div class="card">
          <p class="card-title">Cambiar clave de administrador</p>
          <div class="field">
            <label class="fl">Clave actual</label>
            <input type="password" id="claveActual" placeholder="••••••••" />
          </div>
          <div class="field">
            <label class="fl">Nueva clave</label>
            <input type="password" id="claveNueva" placeholder="••••••••" />
          </div>
          <div class="field">
            <label class="fl">Confirmar nueva clave</label>
            <input type="password" id="claveConfirm" placeholder="••••••••" />
          </div>
          <button class="btn-primary" onclick="cambiarClaveAdmin()">
            Actualizar clave
          </button>
        </div>
      </div>

      <a href="index.html" class="nav-link">⬡ &nbsp;Volver al panel</a>
    </div>

    <!-- ── MODAL EDITAR ── -->
    <div class="modal-overlay" id="editModal">
      <div class="modal">
        <button class="modal-close" onclick="cerrarModal()">✕</button>
        <p class="modal-title">Editar usuario</p>
        <input type="hidden" id="editUsername" />
        <div class="field">
          <label class="fl">Nombre visible</label>
          <input type="text" id="editNombre" />
        </div>
        <div class="field">
          <label class="fl">Nueva contraseña</label>
          <input
            type="password"
            id="editClave"
            placeholder="Dejar vacío para no cambiar"
          />
        </div>
        <div class="field">
          <label class="fl">Rol</label>
          <select id="editRol">
            <option value="operario">Operario</option>
            <option value="supervisor">Supervisor</option>
          </select>
        </div>
        <div class="field">
          <label class="fl">Estado</label>
          <select id="editActivo">
            <option value="true">Activo</option>
            <option value="false">Inactivo</option>
          </select>
        </div>
        <button class="btn-primary" onclick="guardarEdicion()">
          Guardar cambios
        </button>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        updateDoc,
        deleteDoc,
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBKLgOakBA2_2QqWC-APWeTGH2YRsClOXM",
        authDomain: "reclamos-clh.firebaseapp.com",
        projectId: "reclamos-clh",
        storageBucket: "reclamos-clh.firebasestorage.app",
        messagingSenderId: "893651222188",
        appId: "1:893651222188:web:edb9d9963596255633e909",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // ── Verificar sesión ──
      const sesion = sessionStorage.getItem("clh_user");
      if (!sesion) {
        window.location.href = "login.html";
      }

      // La clave admin se guarda en Firestore en config/admin
      let adminUnlocked = false;

      window.verificarAdmin = async function () {
        const clave = document.getElementById("adminKeyInput").value;
        const errEl = document.getElementById("lockError");
        if (!clave) {
          errEl.textContent = "Ingresa la clave";
          return;
        }

        try {
          const snap = await getDoc(doc(db, "config", "admin"));
          let claveAdmin = "admin1234"; // clave por defecto si no existe doc
          if (snap.exists()) claveAdmin = snap.data().clave || "admin1234";

          if (clave !== claveAdmin) {
            errEl.textContent = "✕ Clave incorrecta";
            document.getElementById("adminKeyInput").value = "";
            setTimeout(() => (errEl.textContent = ""), 3000);
            return;
          }

          adminUnlocked = true;
          document.getElementById("lockScreen").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
          cargarUsuarios();
        } catch (err) {
          errEl.textContent = "Error: " + err.message;
        }
      };

      document
        .getElementById("adminKeyInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") window.verificarAdmin();
        });

      // ── Tabs ──
      window.switchTab = function (tab) {
        document.getElementById("tabCrear").style.display = "none";
        document.getElementById("tabUsuarios").style.display = "none";
        document.getElementById("tabClave").style.display = "none";
        document.getElementById("tab1").classList.remove("active");
        document.getElementById("tab2").classList.remove("active");
        document.getElementById("tab3").classList.remove("active");

        if (tab === "crear") {
          document.getElementById("tabCrear").style.display = "block";
          document.getElementById("tab1").classList.add("active");
        }
        if (tab === "usuarios") {
          document.getElementById("tabUsuarios").style.display = "block";
          document.getElementById("tab2").classList.add("active");
          cargarUsuarios();
        }
        if (tab === "clave") {
          document.getElementById("tabClave").style.display = "block";
          document.getElementById("tab3").classList.add("active");
        }
      };

      // ── Crear usuario ──
      window.crearUsuario = async function () {
        const username = document
          .getElementById("newUsername")
          .value.trim()
          .toLowerCase();
        const nombre = document.getElementById("newNombre").value.trim();
        const clave = document.getElementById("newClave").value;
        const rol = document.getElementById("newRol").value;

        if (!username || !nombre || !clave) {
          showToast("Completa todos los campos", "error");
          return;
        }
        if (clave.length < 4) {
          showToast("La clave debe tener al menos 4 caracteres", "error");
          return;
        }
        if (!/^[a-z0-9_]+$/.test(username)) {
          showToast("Username: solo letras, números y _", "error");
          return;
        }

        try {
          const existing = await getDoc(doc(db, "usuarios", username));
          if (existing.exists()) {
            showToast("El username ya existe", "error");
            return;
          }

          await setDoc(doc(db, "usuarios", username), {
            username,
            nombre,
            clave,
            rol,
            activo: true,
            creado: Date.now(),
          });
          showToast("✓ Usuario creado correctamente", "success");
          document.getElementById("newUsername").value = "";
          document.getElementById("newNombre").value = "";
          document.getElementById("newClave").value = "";
        } catch (err) {
          showToast("Error: " + err.message, "error");
        }
      };

      // ── Cargar usuarios ──
      window.cargarUsuarios = async function () {
        const container = document.getElementById("userListContainer");
        container.innerHTML = `<div class="empty-state">Cargando...</div>`;
        try {
          const snap = await getDocs(collection(db, "usuarios"));
          const usuarios = snap.docs
            .map((d) => d.data())
            .sort((a, b) => (b.creado || 0) - (a.creado || 0));
          if (usuarios.length === 0) {
            container.innerHTML = `<div class="empty-state">No hay usuarios registrados</div>`;
            return;
          }
          container.innerHTML = `<div class="user-list">${usuarios
            .map((u) => {
              const inicial = (u.nombre || u.username || "?")[0].toUpperCase();
              const badge =
                u.activo === false
                  ? `<span class="user-badge badge-inactivo">Inactivo</span>`
                  : u.rol === "supervisor" || u.rol === "admin"
                  ? `<span class="user-badge badge-admin">${u.rol}</span>`
                  : `<span class="user-badge badge-operario">${
                      u.rol || "operario"
                    }</span>`;
              return `
              <div class="user-row">
                <div class="user-avatar">${inicial}</div>
                <div class="user-info">
                  <div class="user-name">${u.nombre || u.username}</div>
                  <div class="user-meta">@${u.username}</div>
                </div>
                ${badge}
                <div class="user-actions">
                  <button class="btn-icon" onclick="abrirEditar('${
                    u.username
                  }')" title="Editar">✏️</button>
                  <button class="btn-icon danger" onclick="eliminarUsuario('${
                    u.username
                  }')" title="Eliminar">🗑</button>
                </div>
              </div>`;
            })
            .join("")}</div>`;
        } catch (err) {
          container.innerHTML = `<div class="empty-state">Error: ${err.message}</div>`;
        }
      };

      // ── Abrir modal editar ──
      window._usuariosCache = {};
      window.abrirEditar = async function (username) {
        try {
          const snap = await getDoc(doc(db, "usuarios", username));
          if (!snap.exists()) return;
          const u = snap.data();
          document.getElementById("editUsername").value = username;
          document.getElementById("editNombre").value = u.nombre || "";
          document.getElementById("editClave").value = "";
          document.getElementById("editRol").value = u.rol || "operario";
          document.getElementById("editActivo").value =
            u.activo === false ? "false" : "true";
          document.getElementById("editModal").classList.add("active");
        } catch (err) {
          showToast("Error: " + err.message, "error");
        }
      };

      window.cerrarModal = function () {
        document.getElementById("editModal").classList.remove("active");
      };

      window.guardarEdicion = async function () {
        const username = document.getElementById("editUsername").value;
        const nombre = document.getElementById("editNombre").value.trim();
        const clave = document.getElementById("editClave").value;
        const rol = document.getElementById("editRol").value;
        const activo = document.getElementById("editActivo").value === "true";

        const update = { nombre, rol, activo };
        if (clave) {
          if (clave.length < 4) {
            showToast("La clave debe tener al menos 4 caracteres", "error");
            return;
          }
          update.clave = clave;
        }
        try {
          await updateDoc(doc(db, "usuarios", username), update);
          showToast("✓ Usuario actualizado", "success");
          cerrarModal();
          cargarUsuarios();
        } catch (err) {
          showToast("Error: " + err.message, "error");
        }
      };

      window.eliminarUsuario = async function (username) {
        if (
          !confirm(
            `¿Eliminar el usuario "${username}"? Esta acción no se puede deshacer.`
          )
        )
          return;
        try {
          await deleteDoc(doc(db, "usuarios", username));
          showToast("✓ Usuario eliminado", "success");
          cargarUsuarios();
        } catch (err) {
          showToast("Error: " + err.message, "error");
        }
      };

      // ── Cambiar clave admin ──
      window.cambiarClaveAdmin = async function () {
        const actual = document.getElementById("claveActual").value;
        const nueva = document.getElementById("claveNueva").value;
        const confirm = document.getElementById("claveConfirm").value;

        if (!actual || !nueva || !confirm) {
          showToast("Completa todos los campos", "error");
          return;
        }
        if (nueva !== confirm) {
          showToast("Las claves nuevas no coinciden", "error");
          return;
        }
        if (nueva.length < 6) {
          showToast("La nueva clave debe tener al menos 6 caracteres", "error");
          return;
        }

        try {
          const snap = await getDoc(doc(db, "config", "admin"));
          let claveActualDB = "admin1234";
          if (snap.exists()) claveActualDB = snap.data().clave || "admin1234";

          if (actual !== claveActualDB) {
            showToast("La clave actual es incorrecta", "error");
            return;
          }

          await setDoc(
            doc(db, "config", "admin"),
            { clave: nueva },
            { merge: true }
          );
          showToast("✓ Clave de administrador actualizada", "success");
          document.getElementById("claveActual").value = "";
          document.getElementById("claveNueva").value = "";
          document.getElementById("claveConfirm").value = "";
        } catch (err) {
          showToast("Error: " + err.message, "error");
        }
      };

      function showToast(msg, type) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className = "toast " + type + " show";
        setTimeout(() => t.classList.remove("show"), 3500);
      }

      // Cerrar modal con Escape
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") cerrarModal();
      });
    </script>
  </body>
</html>
