    <script>
      const Permisos = (function () {
        let sesion = null, perms = null;
        const DEFAULT = { modulos: { modulo1:false,modulo2:false,modulo3:false,modulo4:false,modulo5:false,admin:false }, acciones: { ver:true,crear:false,editar:false,eliminar:false,exportar:false } };
        function toast(msg) {
          let t = document.getElementById("_permToast");
          if (!t) {
            t = document.createElement("div");
            t.id = "_permToast";
            t.style.cssText = "position:fixed;bottom:28px;right:28px;padding:12px 20px;border-radius:8px;font-family:monospace;font-size:12px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#ef4444;z-index:9999;opacity:0;transition:opacity .3s;";
            document.body.appendChild(t);
          }
          t.textContent = msg;
          t.style.opacity = "1";
          setTimeout(() => (t.style.opacity = "0"), 3000);
        }
        function init(moduloId, opts) {
          opts = opts || {};
          const loginPage = opts.loginPage || "login.html";
          const homePage = opts.homePage || "index.html";
          const raw = sessionStorage.getItem("clh_user");
          if (!raw) { window.location.href = loginPage; return null; }
          try { sesion = JSON.parse(raw); } catch (e) { window.location.href = loginPage; return null; }
          perms = sesion.permisos || DEFAULT;
          if (moduloId && perms.modulos?.[moduloId] !== true) { window.location.href = homePage; return null; }
          const arrancar = () => { aplicarUI(); observar(); };
          if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", arrancar); } else { arrancar(); }
          return { sesion, perms };
        }
        function puede(accion) { return perms?.acciones?.[accion] === true; }
        function exigir(accion) { if (!puede(accion)) { toast("No tienes permiso para: " + accion); return false; } return true; }
        function aplicarUI(root) {
          root = root || document;
          root.querySelectorAll("[data-permiso]").forEach((el) => {
            const accion = el.getAttribute("data-permiso");
            if (!puede(accion)) { el.style.display = "none"; el.setAttribute("disabled", "true"); }
          });
        }
        function observar() {
          const obs = new MutationObserver(() => aplicarUI());
          obs.observe(document.body, { childList: true, subtree: true });
        }
        return { init, puede, exigir, aplicarUI };
      })();
      Permisos.init("modulo1");
    </script>

      /* VALIDAR LPN — Corporate Warehouse UI */
      @import url("https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap");

      :root {

      .resultado.advertencia { border-color: rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.06); color: var(--accent-amber); box-shadow: 0 0 20px rgba(245, 158, 11, 0.08); }

      @media (max-width: 520px) {

      .bloque { display: flex; flex-direction: column; gap: 6px; }

    <script>
      /* ============================================================
         LÓGICA DE VALIDACIÓN LPN
         - DAR DE BAJA: todo sale del primer Excel (incluida la columna TIPO)
         - REINTEGRO: el TIPO sale de cruzar NOTA con el Excel "ASN POR NOTA"
         ============================================================ */
      const COLECCION_HISTORIAL_LPN = "historialLPN";
      const NOMBRE_OPERACION = { baja: "DAR DE BAJA", reintegro: "REINTEGRO" };

      let datosExcel = []; // Excel principal
      let listaTipos = []; // Excel ASN POR NOTA: [{clave, digitos, tipo}]
      let listoParaLimpiar = false;

      const $ = (id) => document.getElementById(id);
      const operacionActual = () => $("operacion").value;
      const normalizar = (v) => (v === undefined || v === null ? "" : String(v).trim());
      const claveNota = (v) => normalizar(v).toUpperCase().replace(/[^A-Z0-9]/g, "");
      const soloDigitos = (v) => normalizar(v).replace(/\D/g, "");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      }

      function mostrar(texto, clase = "resultado", html = false) {
        const el = $("resultado");
        el.className = clase;
        if (html) el.innerHTML = texto;
        else el.textContent = texto;
      }

      function limpiarResultado() {
        $("resultado").textContent = "";
        $("resultado").className = "resultado";
        listoParaLimpiar = false;
      }

      function obtenerDB() {
        if (window.__clhDb) return window.__clhDb;
        throw new Error("No se pudo conectar con Firebase Firestore.");
      }

      function obtenerSesionCLH() {
        try { return JSON.parse(sessionStorage.getItem("clh_user")) || {}; }
        catch (_) { return {}; }
      }

      /* ── Lectura de Excel ── */
      async function leerWorkbook(file) {
        return XLSX.read(await file.arrayBuffer(), { type: "array" });
      }

      // Filas con encabezados en MAYÚSCULAS y sin espacios sobrantes
      function filasNormalizadas(hoja) {
        return XLSX.utils.sheet_to_json(hoja, { defval: "" }).map((fila) => {
          const o = {};
          for (const k in fila) o[k.toString().trim().toUpperCase()] = fila[k];
          return o;
        });
      }

      // Busca una hoja con columna NOTA y ASN (o TIPO)
      function extraerListaTipos(workbook) {
        for (const nombre of workbook.SheetNames) {
          const filas = filasNormalizadas(workbook.Sheets[nombre]);
          if (!filas.length || !("NOTA" in filas[0])) continue;
          const col = "ASN" in filas[0] ? "ASN" : "TIPO" in filas[0] ? "TIPO" : null;
          if (!col) continue;
          const lista = filas
            .map((f) => ({ clave: claveNota(f.NOTA), digitos: soloDigitos(f.NOTA), tipo: normalizar(f[col]) }))
            .filter((f) => f.clave && f.tipo);
          if (lista.length) return lista;
        }
        return [];
      }

      $("excelFile").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const wb = await leerWorkbook(file);
          datosExcel = filasNormalizadas(wb.Sheets[wb.SheetNames[0]]);
          console.log("Excel principal cargado:", datosExcel.length, "filas");
        } catch (error) {
          console.error(error);
          mostrar("No se pudo leer el archivo Excel.", "resultado no-encontrado");
        }
      });

      $("excelTipoFile").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          listaTipos = extraerListaTipos(await leerWorkbook(file));
          console.log("ASN POR NOTA cargado:", listaTipos.length, "notas");
          if (!listaTipos.length) {
            mostrar("⚠ No se encontraron las columnas NOTA y ASN en el Excel de ASN POR NOTA.", "resultado advertencia");
          }
        } catch (error) {
          console.error(error);
          mostrar("No se pudo leer el archivo de ASN POR NOTA.", "resultado no-encontrado");
        }
      });

      /* ── Operación: baja / reintegro ── */
      function aplicarOperacion() {
        $("bloqueTipos").style.display = operacionActual() === "reintegro" ? "flex" : "none";
        limpiarResultado();
      }
      $("operacion").addEventListener("change", aplicarOperacion);
      aplicarOperacion();

      /* ── Cruce NOTA → ASN (solo reintegro) ── */
      function obtenerTipoPorNota(nota) {
        const clave = claveNota(nota);
        if (!clave || !listaTipos.length) return "";

        const exacto = listaTipos.find((f) => f.clave === clave);
        if (exacto) return exacto.tipo;

        // Respaldo: mismos dígitos, solo si es único y alguna de las dos notas no trae prefijo de letras
        const d = soloDigitos(nota);
        if (!d) return "";
        const candidatos = listaTipos.filter(
          (f) => f.digitos === d && (!/[A-Z]/.test(f.clave) || !/[A-Z]/.test(clave))
        );
        return candidatos.length === 1 ? candidatos[0].tipo : "";
      }

      // TIPO final según la operación elegida
      function resolverTipo(item) {
        const tipo =
          operacionActual() === "baja" ? normalizar(item.TIPO) : obtenerTipoPorNota(item.NOTA);
        return tipo || "No encontrado";
      }

      /* ── Guardar en Firestore ── */
      async function guardarEnHistorial(item) {
        const firestore = obtenerDB();
        const sesion = obtenerSesionCLH();
        const registro = {
          LPN: normalizar(item.LPN),
          REFERENCIA: normalizar(item.REFERENCIA),
          CANTIDAD: item.CANTIDAD ?? "",
          NOTA: normalizar(item.NOTA),
          TIPO: item.TIPO || "No encontrado",
          OPERACION: NOMBRE_OPERACION[operacionActual()],
          timestamp: Date.now(),
          fechaHora: new Date().toLocaleString("es-CO"),
          registradoPor: sesion.nombre || sesion.username || "—",
          registradoPorUsername: sesion.username || "—",
        };
        await firestore.collection(COLECCION_HISTORIAL_LPN).add(registro);
        return registro;
      }

      function htmlItem(item) {
        return `
          <strong>OPERACIÓN:</strong> ${escapeHtml(NOMBRE_OPERACION[operacionActual()])}<br>
          <strong>REFERENCIA:</strong> ${escapeHtml(item.REFERENCIA)}<br>
          <strong>LPN:</strong> ${escapeHtml(item.LPN)}<br>
          <strong>CANTIDAD:</strong> ${escapeHtml(item.CANTIDAD)}<br>
          <strong>NOTA:</strong> ${escapeHtml(item.NOTA)}<br>
          <strong>TIPO:</strong> ${escapeHtml(item.TIPO)}`;
      }

      async function seleccionar(encoded) {
        try {
          const item = JSON.parse(decodeURIComponent(encoded));
          item.TIPO = resolverTipo(item);
          await guardarEnHistorial(item);
          mostrar(htmlItem(item), "resultado encontrado", true);
          listoParaLimpiar = true;
        } catch (error) {
          console.error(error);
          mostrar("No fue posible guardar el registro en la base de datos.", "resultado no-encontrado");
        }
      }
      window.seleccionar = seleccionar;

      /* ── Buscar ── */
      async function buscarLPN() {
        const valorBusqueda = $("lpnInput").value.trim().toUpperCase();
        const campo = $("filtroCampo").value;
        const resultado = $("resultado");

        if (!datosExcel.length) {
          return mostrar("No hay datos cargados.", "resultado advertencia");
        }
        if (operacionActual() === "reintegro" && !listaTipos.length) {
          return mostrar("Para Reintegro debes cargar el Excel ASN POR NOTA.", "resultado advertencia");
        }
        if (!valorBusqueda) {
          return mostrar("Ingresa un valor para buscar.", "resultado advertencia");
        }

        const coincidencias = datosExcel.filter((item) => {
          const v = item[campo];
          if (v === undefined || v === null || v === "") return false;
          return v.toString().toUpperCase().includes(valorBusqueda);
        });

        if (!coincidencias.length) {
          return mostrar("No se encontraron resultados.", "resultado no-encontrado");
        }

        // Una sola coincidencia: se guarda directo
        if (coincidencias.length === 1) {
          const item = { ...coincidencias[0] };
          item.TIPO = resolverTipo(item);
          try {
            await guardarEnHistorial(item);
            mostrar(htmlItem(item), "resultado encontrado", true);
            listoParaLimpiar = true;
          } catch (error) {
            console.error(error);
            mostrar("El resultado se encontró, pero no pudo guardarse en Firestore.", "resultado no-encontrado");
          }
          return;
        }

        // Varias coincidencias: elegir cuál guardar
        let html = "<strong>Selecciona cuál guardar:</strong><br><br>";
        coincidencias.forEach((item) => {
          const encoded = encodeURIComponent(JSON.stringify(item));
          html += `
            <div style="margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:8px;">
              <strong>LPN:</strong> ${escapeHtml(item.LPN)}<br>
              <strong>REF:</strong> ${escapeHtml(item.REFERENCIA)}<br>
              <strong>NOTA:</strong> ${escapeHtml(item.NOTA)}<br>
              <strong>TIPO:</strong> ${escapeHtml(resolverTipo(item))}<br>
              <button type="button" onclick="seleccionar('${encoded}')">Guardar este</button>
            </div>`;
        });
        mostrar(html, "resultado encontrado", true);
      }
      window.buscarLPN = buscarLPN;

      /* ── Enter: buscar / limpiar ── */
      $("lpnInput").addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        if (listoParaLimpiar) {
          this.value = "";
          limpiarResultado();
          this.focus();
        } else {
          buscarLPN();
        }
      });

      /* ── Botón subir ── */
      const btnTop = $("btnTop");
      window.addEventListener("scroll", () => {
        btnTop.style.display = window.scrollY > 200 ? "block" : "none";
      });
      function irArriba() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      window.irArriba = irArriba;
    </script>
  </body>
</html>
