    <script>
      const Permisos = (function () {
        let sesion = null,
          perms = null;
        const DEFAULT = {
          modulos: {
            modulo1: false,
            modulo2: false,
            modulo3: false,
            modulo4: false,
            modulo5: false,
            admin: false,
          },
          acciones: {
            ver: true,
            crear: false,
            editar: false,
            eliminar: false,
            exportar: false,
          },
        };
        function toast(msg) {
          let t = document.getElementById("_permToast");
          if (!t) {
            t = document.createElement("div");
            t.id = "_permToast";
            t.style.cssText =
              "position:fixed;bottom:28px;right:28px;padding:12px 20px;border-radius:8px;font-family:monospace;font-size:12px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#ef4444;z-index:9999;opacity:0;transition:opacity .3s;";
            document.body.appendChild(t);
          }
          t.textContent = msg;
          t.style.opacity = "1";
          setTimeout(() => (t.style.opacity = "0"), 3000);
        }
        function init(moduloId, opts) {
          opts = opts || {};
          const loginPage = opts.loginPage || "login.html";
          const homePage = opts.homePage || "index.html";
          const raw = sessionStorage.getItem("clh_user");
          if (!raw) {
            window.location.href = loginPage;
            return null;
          }
          try {
            sesion = JSON.parse(raw);
          } catch (e) {
            window.location.href = loginPage;
            return null;
          }
          perms = sesion.permisos || DEFAULT;
          if (moduloId && perms.modulos?.[moduloId] !== true) {
            window.location.href = homePage;
            return null;
          }
          const arrancar = () => {
            aplicarUI();
            observar();
          };
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", arrancar);
          } else {
            arrancar();
          }
          return { sesion, perms };
        }
        function puede(accion) {
          return perms?.acciones?.[accion] === true;
        }
        function exigir(accion) {
          if (!puede(accion)) {
            toast("No tienes permiso para: " + accion);
            return false;
          }
          return true;
        }
        function aplicarUI(root) {
          root = root || document;
          root.querySelectorAll("[data-permiso]").forEach((el) => {
            const accion = el.getAttribute("data-permiso");
            if (!puede(accion)) {
              el.style.display = "none";
              el.setAttribute("disabled", "true");
            }
          });
        }
        function observar() {
          const obs = new MutationObserver(() => aplicarUI());
          obs.observe(document.body, { childList: true, subtree: true });
        }
        return { init, puede, exigir, aplicarUI };
      })();
      Permisos.init("modulo1");
    </script>
    <style>
      /* ================================================
      VALIDAR LPN — Corporate Warehouse UI
      Aesthetic: Industrial Precision / Dark Command Center

      @import url("https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap");

      /* ── CSS VARIABLES ── */
      :root {
        --bg-deep: #0b0f1a;
        --bg-panel: #111827;
        --bg-card: #1a2235;
        --accent-primary: #00d4ff;
        --accent-glow: rgba(0, 212, 255, 0.15);
        --accent-amber: #f59e0b;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --border: rgba(0, 212, 255, 0.12);
        --border-strong: rgba(0, 212, 255, 0.35);
        --text-primary: #e8edf5;
        --text-secondary: #8fa3c0;
        --text-muted: #4d6080;
        --shadow-card: 0 24px 64px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--border);
        --shadow-glow: 0 0 40px rgba(0, 212, 255, 0.12);
        --font-display: "Rajdhani", sans-serif;
        --font-mono: "DM Mono", monospace;
        --radius: 14px;
        --radius-sm: 8px;
      }

      /* ── RESET ── */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ── BODY ── */
      body {
        font-family: var(--font-display);
        background-color: var(--bg-deep);
        background-image: radial-gradient(
            ellipse 70% 50% at 50% -5%,
            rgba(0, 212, 255, 0.1),
            transparent 65%
          ),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 39px,
            rgba(0, 212, 255, 0.022) 39px,
            rgba(0, 212, 255, 0.022) 40px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 39px,
            rgba(0, 212, 255, 0.022) 39px,
            rgba(0, 212, 255, 0.022) 40px
          );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        color: var(--text-primary);
      }

      /* ── CARD CONTENEDOR ── */
      .contenedor {
        width: 100%;
        max-width: 460px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 40px 36px 36px;
        box-shadow: var(--shadow-card), var(--shadow-glow);
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
        animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Línea decorativa superior */
      .contenedor::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        width: 80%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent-primary),
          transparent
        );
        border-radius: 2px;
      }

      /* ── TÍTULO ── */
      h2 {
        font-family: var(--font-display);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-primary);
        text-align: center;
        margin-bottom: 28px;
        position: relative;
      }

      h2::after {
        content: "";
        display: block;
        width: 40px;
        height: 2px;
        background: var(--accent-primary);
        margin: 10px auto 0;
        border-radius: 2px;
        box-shadow: 0 0 10px var(--accent-primary);
      }

      /* ── LABELS ── */
      label {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 14px;
        margin-bottom: 4px;
      }

      /* ── INPUTS ── */
      input[type="text"],
      input[type="file"] {
        width: 100%;
        background: rgba(11, 15, 26, 0.7);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 13px;
        padding: 12px 16px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        outline: none;
      }

      input[type="text"]::placeholder {
        color: var(--text-muted);
        font-size: 12px;
      }

      input[type="text"]:focus,
      input[type="file"]:focus {
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      }

      /* File input styling */
      input[type="file"] {
        cursor: pointer;
        padding: 10px 16px;
        color: var(--text-secondary);
      }

      input[type="file"]::-webkit-file-upload-button {
        background: rgba(0, 212, 255, 0.08);
        color: var(--accent-primary);
        border: 1px solid var(--border-strong);
        border-radius: 4px;
        padding: 5px 12px;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        margin-right: 12px;
        transition: background 0.2s;
      }

      input[type="file"]::-webkit-file-upload-button:hover {
        background: rgba(0, 212, 255, 0.16);
      }

      /* ── BUTTON BUSCAR ── */
      button {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        background: linear-gradient(135deg, #0a3d62, #1e5f8e);
        color: var(--accent-primary);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          transparent 40%,
          rgba(0, 212, 255, 0.08)
        );
        opacity: 0;
        transition: opacity 0.2s;
      }

      button:hover {
        background: linear-gradient(135deg, #0d4e7a, #2470a8);
        box-shadow: 0 0 35px rgba(0, 212, 255, 0.25);
        transform: translateY(-2px);
      }

      button:hover::before {
        opacity: 1;
      }

      button:active {
        transform: translateY(0px) scale(0.98);
        box-shadow: 0 0 15px rgba(0, 212, 255, 0.15);
      }

      /* ── RESULTADO ── */
      .resultado {
        margin-top: 22px;
        min-height: 0;
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 1.7;
        transition: all 0.3s ease;
        overflow: hidden;
      }

      .resultado:not(:empty) {
        padding: 16px 18px;
        border: 1px solid var(--border);
        background: rgba(11, 15, 26, 0.6);
        color: var(--text-secondary);
        animation: fadeIn 0.35s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Estados semánticos — agregar clase via JS al div#resultado */
      .resultado.encontrado {
        border-color: rgba(16, 185, 129, 0.4);
        background: rgba(16, 185, 129, 0.06);

      .resultado.no-encontrado {

        background: rgba(239, 68, 68, 0.06);
        color: var(--accent-red);
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.08);

        box-shadow: 0 0 20px rgba(245, 158, 11, 0.08);

      }

    <script>
      /* ============================================================
   LÓGICA DE VALIDACIÓN LPN
   ============================================================ */
      let datosExcel = [];
      let datosTipos = [];
      const COLECCION_HISTORIAL_LPN = "historialLPN";

      function obtenerDB() {
        if (window.__clhDb) return window.__clhDb;
        if (typeof db !== "undefined") return db;
        throw new Error("No se pudo conectar con Firebase Firestore.");
      }

      function obtenerSesionCLH() {
        try {
          return JSON.parse(sessionStorage.getItem("clh_user")) || {};
        } catch (_) {
          return {};
        }
      }

      function normalizar(v) {
        return v === undefined || v === null ? "" : String(v).trim();
      }

      function obtenerTipoPorNota(nota) {
        const buscada = normalizar(nota).toUpperCase();
        if (!buscada || !Array.isArray(datosTipos)) return "";

        const encontrado = datosTipos.find((item) => {
          const notaItem = normalizar(
            item.NOTA || item.Nota || item.nota
          ).toUpperCase();
          return notaItem === buscada;
        });

        return encontrado
          ? normalizar(encontrado.TIPO || encontrado.Tipo || encontrado.tipo)
          : "";
      }

      function mostrarMensajeResultado(texto, clase = "resultado") {
        const el = document.getElementById("resultado");
        if (!el) return;
        el.className = clase;
        el.innerHTML = texto;
      }

      async function guardarEnHistorial(item) {
        try {
          const firestore = obtenerDB();
          const sesion = obtenerSesionCLH();
          const registro = {
            LPN: normalizar(item.LPN),
            REFERENCIA: normalizar(item.REFERENCIA),
            CANTIDAD: item.CANTIDAD ?? "",
            NOTA: normalizar(item.NOTA),
            TIPO:
              normalizar(item.TIPO) ||
              obtenerTipoPorNota(item.NOTA) ||
              "No encontrado",
            timestamp: Date.now(),
            fechaHora: new Date().toLocaleString("es-CO"),
            registradoPor: sesion.nombre || sesion.username || "—",
            registradoPorUsername: sesion.username || "—",
          };

          await firestore.collection(COLECCION_HISTORIAL_LPN).add(registro);
          return registro;
        } catch (error) {
          console.error("Error guardando historial LPN:", error);
          throw error;
        }
      }

      async function seleccionar(encoded) {
        try {
          const item = JSON.parse(decodeURIComponent(encoded));
          item.TIPO = obtenerTipoPorNota(item.NOTA) || "No encontrado";
          await guardarEnHistorial(item);

          mostrarMensajeResultado(
            `
      <strong>REFERENCIA:</strong> ${escapeHtml(item.REFERENCIA)}<br>
      <strong>LPN:</strong> ${escapeHtml(item.LPN)}<br>
      <strong>CANTIDAD:</strong> ${escapeHtml(item.CANTIDAD)}<br>
      <strong>NOTA:</strong> ${escapeHtml(item.NOTA)}<br>
      <strong>TIPO:</strong> ${escapeHtml(item.TIPO)}
    `,
            "resultado encontrado"
          );
        } catch (error) {
          console.error(error);
          mostrarMensajeResultado(
            "No fue posible guardar el registro en la base de datos.",
            "resultado no-encontrado"
          );
        }
      }
      window.seleccionar = seleccionar;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function buscarLPN() {
        const valorBusqueda = document
          .getElementById("lpnInput")
          .value.trim()
          .toUpperCase();
        const campo = document.getElementById("filtroCampo").value;
        const resultado = document.getElementById("resultado");

        if (!datosExcel || datosExcel.length === 0) {
          resultado.textContent = "No hay datos cargados.";
          resultado.className = "resultado advertencia";
          return;
        }

        if (!valorBusqueda) {
          resultado.textContent = "Ingresa un valor para buscar.";
          resultado.className = "resultado advertencia";
          return;
        }

        const coincidencias = datosExcel.filter((item) => {
          const valorCampo = item[campo];
          if (
            valorCampo === undefined ||
            valorCampo === null ||
            valorCampo === ""
          )
            return false;
          return valorCampo.toString().toUpperCase().includes(valorBusqueda);
        });

        if (coincidencias.length > 0) {
          resultado.className = "resultado encontrado";

          if (coincidencias.length === 1) {
            const item = { ...coincidencias[0] };
            item.TIPO = obtenerTipoPorNota(item.NOTA);

            try {
              await guardarEnHistorial(item);
              resultado.innerHTML = `
          <strong>REFERENCIA:</strong> ${escapeHtml(item.REFERENCIA)}<br>
          <strong>LPN:</strong> ${escapeHtml(item.LPN)}<br>
          <strong>CANTIDAD:</strong> ${escapeHtml(item.CANTIDAD)}<br>
          <strong>NOTA:</strong> ${escapeHtml(item.NOTA)}<br>
          <strong>TIPO:</strong> ${escapeHtml(item.TIPO || "No encontrado")}
        `;
            } catch (error) {
              resultado.textContent =
                "El resultado se encontró, pero no pudo guardarse en Firestore.";
              resultado.className = "resultado no-encontrado";
              console.error(error);
            }
            return;
          }

          resultado.innerHTML =
            "<strong>Selecciona cuál guardar:</strong><br><br>";

          coincidencias.forEach((item) => {
            const tipoPreview = obtenerTipoPorNota(item.NOTA) || "—";
            const encoded = encodeURIComponent(JSON.stringify(item));
            resultado.innerHTML += `
        <div style="margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:8px;">
          <strong>LPN:</strong> ${escapeHtml(item.LPN)}<br>
          <strong>REF:</strong> ${escapeHtml(item.REFERENCIA)}<br>
          <strong>NOTA:</strong> ${escapeHtml(item.NOTA)}<br>
          <strong>TIPO:</strong> ${escapeHtml(tipoPreview)}<br>
          <button type="button" onclick="seleccionar('${encoded}')">Guardar este</button>
        </div>
      `;
          });
        } else {
          resultado.textContent = "No se encontraron resultados.";
          resultado.className = "resultado no-encontrado";
        }
      }
      window.buscarLPN = buscarLPN;

      async function cargarExcelLPN(file) {
        if (!file) return;
        try {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data, { type: "array" });
          const hoja = workbook.Sheets[workbook.SheetNames[0]];
          datosExcel = XLSX.utils.sheet_to_json(hoja, { defval: "" });
        } catch (error) {
          console.error(error);
          mostrarMensajeResultado(
            "No se pudo leer el archivo Excel.",
            "resultado no-encontrado"
          );
        }
      }

      async function cargarExcelTipos(file) {
        if (!file) return;
        try {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data, { type: "array" });
          const hoja = workbook.Sheets[workbook.SheetNames[0]];
          datosTipos = XLSX.utils.sheet_to_json(hoja, { defval: "" });
        } catch (error) {
          console.error(error);
          mostrarMensajeResultado(
            "No se pudo leer el archivo de Tipos.",
            "resultado no-encontrado"
          );
        }
      }

      function irArriba() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      window.irArriba = irArriba;

      document
        .getElementById("excelFile")
        ?.addEventListener("change", (e) => cargarExcelLPN(e.target.files[0]));
      document
        .getElementById("excelTipoFile")
        ?.addEventListener("change", (e) =>
          cargarExcelTipos(e.target.files[0])
        );

      // Permite seguir usando Enter como antes.
      document
        .getElementById("lpnInput")
        ?.addEventListener("keydown", function (e) {
          if (e.key !== "Enter") return;
          const estado = document.getElementById("resultado");
          if (estado && estado.classList.contains("encontrado")) {
            this.value = "";
            estado.textContent = "";
            estado.className = "resultado";
          } else {
            buscarLPN();
          }
        });
    </script>
  </body>
</html>
